<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МедКвадрат — расписание филиалов</title>
<style>
  :root{
    --ink:#0F1E1C;
    --paper:#EEF1EE;
    --surface:#FFFFFF;
    --brand:#0E4F45;
    --brand-soft:#E4EFEC;
    --line:#D5DBD7;
    --line-soft:#E7EBE8;
    --muted:#6B7670;

    --ok:#1E7A4C;
    --ok-bg:#E6F4EC;
    --no:#B3261E;
    --no-bg:#FBEAE9;
    --move:#9A6100;
    --move-bg:#FBF0DC;
    --wait:#71797A;
    --wait-bg:#EDEFEF;

    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono","DejaVu Sans Mono",monospace;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--ui);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  @media (min-width:1024px){
    body{height:100%;overflow:hidden}
  }

  /* ---------- шапка ---------- */
  .top{
    background:var(--brand);color:#fff;
    padding:10px 18px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .brand{
    font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    white-space:nowrap;
  }
  .brand span{opacity:.62;font-weight:500;letter-spacing:.08em;margin-left:10px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .clock{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;opacity:.85}
  .dot{width:8px;height:8px;border-radius:50%;background:#7BE0A8;animation:pulse 2s ease-in-out infinite}
  .dot.stale{background:#FFC46B;animation:none}
  .dot.down{background:#FF8A80;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  input[type=date]{
    font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;
  }
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;cursor:pointer}
  .btn{
    font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;
    border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  }
  .btn:hover{background:rgba(255,255,255,.14)}
  :focus-visible{outline:2px solid #7BE0A8;outline-offset:2px}

  /* ---------- баннер состояния ---------- */
  .banner{
    display:none;padding:8px 18px;font-size:13px;
    background:#FBF0DC;color:#6B4A00;border-bottom:1px solid #E8D9B4;
  }
  .banner.show{display:block}
  .note{
    margin:0;padding:6px 18px;font-size:12px;color:var(--muted);
    background:var(--surface);border-bottom:1px solid var(--line-soft);
  }

  /* ---------- сетка филиалов ---------- */
  .board{
    flex:1;display:grid;grid-template-columns:repeat(3,1fr);
    gap:1px;background:var(--line);min-height:0;
  }
  .col{background:var(--paper);display:flex;flex-direction:column;min-height:0}

  .col-head{
    padding:12px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);
  }
  .col-name{font-size:17px;font-weight:650;letter-spacing:-.01em}
  .col-addr{font-size:12px;color:var(--muted);margin-top:2px}
  .col-stats{display:flex;gap:14px;margin-top:9px;font-size:12px;font-variant-numeric:tabular-nums}
  .stat b{font-family:var(--mono);font-weight:600;font-size:13px}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .stat.move b{color:var(--move)} .stat.wait b{color:var(--wait)}

  .list{
    flex:1;overflow-y:auto;padding:8px 10px 18px;min-height:0;scrollbar-width:thin;overflow-anchor:none;
    border-bottom:1px solid var(--line);box-shadow:inset 0 -14px 12px -12px rgba(15,30,28,.28);
  }
  .schedule-end{margin-top:8px;padding:12px 8px;text-align:center;color:var(--ink);font-size:12px;border-top:1px solid var(--line)}

  /* ---------- карточка приёма ---------- */
  .row{
    display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;
    background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--wait);
    border-radius:7px;padding:8px 10px;margin-bottom:6px;
    transition:background-color .8s ease;
  }
  .row.past{opacity:.42}
  .row.confirmed{border-left-color:var(--ok)}
  .row.declined{border-left-color:var(--no)}
  .row.reschedule{border-left-color:var(--move)}
  .row.fresh{background:var(--brand-soft);border-color:#BFD9D2}
  @media (prefers-reduced-motion:no-preference){
    .row.fresh{animation:flash 1.1s ease-out}
  }
  @keyframes flash{0%{transform:translateX(3px)}60%{transform:none}}

  .time{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
  .who{min-width:0}
  .patient{font-size:14px;font-weight:550;line-height:1.25;word-break:break-word}
  .doctor{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
  .tagline{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:550}
  .pill.confirmed{background:var(--ok-bg);color:var(--ok)}
  .pill.declined{background:var(--no-bg);color:var(--no)}
  .pill.reschedule{background:var(--move-bg);color:var(--move)}
  .pill.pending{background:var(--wait-bg);color:var(--wait)}
  .pill.waitlist{background:var(--wait-bg);color:var(--wait)}
  .row.waitlist{border-left-style:dashed}
  .via{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

  /* ---------- линия «сейчас» ---------- */
  .now{display:flex;align-items:center;gap:8px;margin:10px 2px 12px}
  .now::before,.now::after{content:"";height:2px;background:var(--brand);flex:1;opacity:.55}
  .now span{
    font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand);
    letter-spacing:.1em;white-space:nowrap;
  }

  .empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}

  .tabs{display:flex;gap:8px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
  .tab{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tab .count{font-family:var(--mono);margin-left:6px;opacity:.85}
  .waitlist-panel{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 18px 24px}
  .waitlist-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px}
  .waitlist-filters select{font:inherit;padding:4px 8px}
  .waitlist-table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13px}
  .waitlist-table th,.waitlist-table td{border-bottom:1px solid var(--line-soft);padding:8px 10px;text-align:left;vertical-align:top}
  .waitlist-table th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .waitlist-table tr.fresh{background:var(--brand-soft)}
  .pager{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
  .btn.light,.waitlist-table .btn,.staff-panel .btn,.modal-actions .btn{
    color:var(--ink);background:#fff;border:1px solid #5C675F;
  }
  .btn.light:disabled,.waitlist-table .btn:disabled,.staff-panel .btn:disabled{
    color:#3A4440;background:#D5DBD7;border-color:#5C675F;cursor:default;
  }
  .branch-label{font-size:13px;color:#fff}
  select.top-select{font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff}
  .med-alert{color:#9A5B00;font-weight:700}
  .wl-saved{color:var(--ok);font-size:12px;margin-top:6px}
  .wl-meta{color:var(--muted);font-size:11px;margin-top:6px}
  .modal{position:fixed;inset:0;background:rgba(15,30,28,.35);display:flex;align-items:center;justify-content:center;z-index:5;padding:18px}
  .modal-card{background:#fff;padding:20px;border-radius:10px;max-width:440px;border:1px solid var(--line)}
  .modal-card p{margin:0 0 14px;line-height:1.45}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  .staff-panel{flex:1;overflow:auto;padding:12px 18px 24px}
  .staff-panel table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
  .staff-panel th,.staff-panel td{border-bottom:1px solid var(--line-soft);padding:8px;text-align:left}
  .staff-form{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:end}
  .staff-form input,.staff-form select{font:inherit;padding:6px 8px}
  .staff-panel .btn{margin-right:6px}

  @media (max-width:900px){
    .board{grid-template-columns:1fr;gap:0}
    .col{border-bottom:1px solid var(--line)}
    .list{overflow:visible;padding-bottom:10px}
    body{height:auto}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">МедКвадрат <span>расписание филиалов</span></div>
  <div class="top-right">
    <select id="branch" class="top-select" aria-label="Филиал"><option value="">Все мои</option></select>
    <input type="date" id="date" autocomplete="off" aria-label="Дата расписания">
    <button class="btn" id="today">Сегодня</button>
    <div class="live"><span class="dot" id="dot"></span><span id="liveText">подключение…</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<div class="tabs" role="tablist">
  <button class="tab active" id="tabSchedule" type="button">Расписание</button>
  <button class="tab" id="tabWaitlist" type="button">Лист ожидания <span class="count" id="waitlistCount">0</span></button>
  <button class="tab" id="tabStaff" type="button" hidden>Сотрудники</button>
</div>
<p class="note" id="noteSchedule">Отметки ответов пациентов из MAX. Запись в Медиалоге не меняется — отмену или перенос делайте в клиенте</p>
<p class="note" id="noteWaitlist" hidden>Отметки ответов пациентов из MAX. Запись в Медиалоге не меняется — отмену или перенос делайте в клиенте</p>

<div class="banner" id="banner" role="status"></div>

<main class="board" id="board"></main>
<section class="waitlist-panel" id="waitlistPanel" hidden>
  <div class="waitlist-filters">
    <label>Строки
      <select id="wlStatus">
        <option value="open">открытые</option>
        <option value="all">все</option>
      </select>
    </label>
    <label>Статус
      <select id="wlWork">
        <option value="all">все</option>
        <option value="new">новые</option>
        <option value="contacted">в работе</option>
        <option value="rebooked">записан</option>
        <option value="closed">закрыт</option>
      </select>
    </label>
    <label>Источник
      <select id="wlSource">
        <option value="all">все</option>
        <option value="max">MAX</option>
        <option value="registry">регистратура</option>
      </select>
    </label>
  </div>
  <div id="waitlistList"></div>
  <div class="pager" id="wlPager">
    <button class="btn light" id="wlPrev" type="button">Назад</button>
    <span id="wlPageLabel">1</span>
    <button class="btn light" id="wlNext" type="button">Вперёд</button>
  </div>
</section>
<section class="staff-panel" id="staffPanel" hidden>
  <h2>Сотрудники</h2>
  <form id="staffForm" class="staff-form">
    <label>Логин <input id="staffLogin" required></label>
    <label>Имя <input id="staffName" required></label>
    <label>Роль
      <select id="staffRole">
        <option value="registrar">Регистратор</option>
        <option value="manager">Директор / колл-центр</option>
        <option value="admin">ИТ</option>
      </select>
    </label>
    <label>Филиалы <input id="staffBranches" value="106" placeholder="106 или 3,496 или *"></label>
    <button class="btn" type="submit" style="color:var(--ink);border-color:var(--line)">Добавить</button>
  </form>
  <div id="staffTemp" class="wl-saved"></div>
  <div id="staffTable"></div>
</section>
<div class="modal" id="confirmModal" hidden>
  <div class="modal-card">
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn light" id="confirmNo" type="button">Отмена</button>
      <button class="btn" id="confirmYes" type="button" style="background:var(--brand);color:#fff;border-color:var(--brand)">Закрыть</button>
    </div>
  </div>
</div>

<script>
// ─────────── настройки ───────────
const CONFIG = {
  // Same-origin + staff session cookie (mk_staff). No bearer token in the browser.
  API_BASE: '',
  ENDPOINT: '/dashboard/data',
  WAITLIST: '/dashboard/waitlist',
  POLL_MS: 10000,     // как часто опрашиваем расписание
  FRESH_MS: 6000,     // сколько подсвечивать изменившуюся запись
  STALE_MS: 35000     // после этого данные считаем устаревшими
};

const ADDRESSES = {
  106: 'Каширское шоссе, 74к1',
  3:   'ул. Ландышевая, 14к1',
  496: 'ул. Воротынская, 4'
};

const LABEL = {
  confirmed:  'придёт',
  declined:   'не придёт',
  reschedule: 'нужен перенос',
  pending:    'без ответа'
};

// ─────────── состояние ───────────
const msk = d => new Date(d.toLocaleString('en-US', {timeZone: 'Europe/Moscow'}));
const todayISO = () => {
  const d = msk(new Date());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
let lastSeen = new Map();   // planning_id -> confirmation (для диффа)
let freshUntil = new Map(); // planning_id -> timestamp
let lastOkAt = 0;
let timer = null;
let activeTab = 'schedule';
let wlPage = 1;
let wlSeen = new Map();
let wlFresh = new Map();
let viewEpoch = 0;
let scheduleBusy = false;
let waitlistBusy = false;
let scheduleQueued = false;
let waitlistQueued = false;
let programmaticScroll = false;
let userScrolled = new Set();
let followedDay = '';
let scheduleKey = '';
let waitlistKey = '';
const pendingWl = new Map();
const BUSY_MS = 5000;
const BRANCH_NAME = {106:'Каширка', 3:'Куркино', 496:'Куркино 2'};
const REASON_LABEL = {declined:'не придёт', reschedule:'перенос'};
const OUTCOMES = [
  ['no_answer','не дозвонились'],
  ['call_back','перезвонить позже'],
  ['rebooked','записан на другое время'],
  ['refused','отказался от записи'],
  ['other','другое (закрыть)']
];
const CLOSING = new Set(['rebooked','refused','other']);
let dashUser = '';

const $ = id => document.getElementById(id);
const board = $('board'), banner = $('banner'), dot = $('dot'), liveText = $('liveText');
$('date').autocomplete = 'off';
followedDay = todayISO();
$('date').value = followedDay;

setInterval(() => {
  const d = msk(new Date());
  $('clock').textContent = d.toTimeString().slice(0,8);
  renderStaleness();
  const day = todayISO();
  if ($('date').value === followedDay && day !== followedDay) {
    followedDay = day;
    $('date').value = day;
    viewEpoch++;
    userScrolled.clear();
    scheduleKey = '';
    load();
  }
  if (activeTab === 'schedule') {
    document.querySelectorAll('.col').forEach(col => {
      const list = col.querySelector('.list');
      if (!list) return;
      const nowEl = list.querySelector('.now');
      const beforeId = nowEl && nowEl.nextElementSibling ? nowEl.nextElementSibling.dataset.id || '' : '';
      const keep = list.scrollTop;
      const anchor = captureAnchor(list);
      placeNow(list, $('date').value === todayISO(), minutesNow());
      list.querySelectorAll('.row').forEach(row => {
        const past = $('date').value === todayISO() && toMinutes(row.dataset.time) <= minutesNow();
        row.classList.toggle('past', past);
      });
      const nowEl2 = list.querySelector('.now');
      const afterId = nowEl2 && nowEl2.nextElementSibling ? nowEl2.nextElementSibling.dataset.id || '' : '';
      if (beforeId === afterId) {
        if (list.scrollTop !== keep) {
          programmaticScroll = true;
          list.scrollTop = keep;
          programmaticScroll = false;
        }
      } else restoreAnchor(list, anchor);
    });
  }
}, 1000);

function load() {
  if (activeTab === 'waitlist') return loadWaitlist();
  return loadSchedule();
}

async function loadSchedule() {
  if (scheduleBusy) { scheduleQueued = true; return; }
  scheduleBusy = true;
  const epoch = viewEpoch;
  const date = $('date').value || todayISO();
  const branch = $('branch') ? $('branch').value : '';
  const url = `${CONFIG.API_BASE}${CONFIG.ENDPOINT}?date=${encodeURIComponent(date)}${branch ? `&branch=${encodeURIComponent(branch)}` : ''}`;
  try {
    const res = await fetch(url, {credentials: 'same-origin'});
    if (epoch !== viewEpoch || date !== ($('date').value || todayISO()) || ($('branch') && branch !== $('branch').value) || activeTab !== 'schedule') return;
    if (await authStop(res)) return;
    if (!res.ok) throw new Error(`сервер ответил ${res.status}`);
    const body = await res.json();
    if (!body.success) throw new Error(body.error || 'сервер вернул ошибку');
    if (epoch !== viewEpoch || selectingText()) return;
    lastOkAt = Date.now();
    hideBanner();
    paintSchedule(body.data);
    await refreshWaitlistCount();
  } catch (err) {
    if (epoch === viewEpoch) showBanner(`Не удалось обновить расписание: ${err.message}. Показаны последние полученные данные.`);
  } finally {
    scheduleBusy = false;
    if (scheduleQueued || epoch !== viewEpoch) {
      scheduleQueued = false;
      if (activeTab === 'schedule') loadSchedule();
      else arm();
    } else arm();
  }
}

function paintSchedule(data) {
  const branches = data.branches || [];
  const date = data.date || $('date').value;
  const key = date + '|' + branches.map(b => b.branch_id).join(',');
  const fresh = key !== scheduleKey;
  if (fresh) {
    scheduleKey = key;
    board.innerHTML = '';
    branches.forEach(b => board.appendChild(buildColumn(b)));
  }
  const seenNow = new Map();
  branches.forEach(b => (b.appointments || []).forEach(a => {
    const id = a.planning_id;
    const val = a.confirmation || 'pending';
    seenNow.set(id, val);
    if (lastSeen.size && lastSeen.has(id) && lastSeen.get(id) !== val) {
      freshUntil.set(id, Date.now() + CONFIG.FRESH_MS);
    }
  }));
  lastSeen = seenNow;
  const isToday = date === todayISO();
  const nowMin = minutesNow();
  branches.forEach(b => syncColumn(b, isToday, nowMin, fresh));
  [...board.querySelectorAll('.col')].forEach(col => {
    if (!branches.some(b => String(b.branch_id) === col.dataset.branch)) col.remove();
  });
}

function buildColumn(branch) {
  const col = el('section', 'col');
  col.dataset.branch = String(branch.branch_id);
  const head = el('div', 'col-head');
  head.appendChild(el('div', 'col-name', branch.name || branch.branch_code || '—'));
  head.appendChild(el('div', 'col-addr', ADDRESSES[branch.branch_id] || ''));
  const stats = el('div', 'col-stats');
  [['ok','придут'],['wait','молчат'],['move','перенос'],['no','откажутся']].forEach(([kind, label]) => {
    stats.appendChild(stat(kind, 0, label));
  });
  head.appendChild(stats);
  col.appendChild(head);
  const list = el('div', 'list');
  list.addEventListener('scroll', () => {
    if (programmaticScroll) return;
    userScrolled.add(String(branch.branch_id));
  }, {passive: true});
  col.appendChild(list);
  return col;
}

function syncColumn(branch, isToday, nowMin, auto) {
  const col = board.querySelector(`.col[data-branch="${branch.branch_id}"]`);
  if (!col) return;
  const items = branch.appointments || [];
  const counts = {confirmed:0, declined:0, reschedule:0, pending:0};
  items.forEach(a => {
    if (a.is_waitlist) return;
    if (a.confirmation_hint && !a.confirmation) return;
    counts[a.confirmation || 'pending']++;
  });
  const map = {ok: counts.confirmed, wait: counts.pending, move: counts.reschedule, no: counts.declined};
  Object.entries(map).forEach(([kind, value]) => {
    const b = col.querySelector(`.stat.${kind} b`);
    const text = String(value);
    if (b && b.textContent !== text) b.textContent = text;
  });
  const name = col.querySelector('.col-name');
  const title = branch.name || branch.branch_code || '—';
  if (name.textContent !== title) name.textContent = title;
  const list = col.querySelector('.list');
  const ids = items.map(a => String(a.planning_id));
  const prev = [...list.querySelectorAll('.row')].map(r => r.dataset.id);
  const same = prev.length === ids.length && prev.every((id, i) => id === ids[i]);
  const anchor = same ? null : captureAnchor(list);
  const keepScroll = list.scrollTop;
  if (!items.length) {
    list.querySelectorAll('.row,.now').forEach(n => n.remove());
    if (!list.querySelector('.empty')) list.appendChild(el('div', 'empty', 'На этот день записей нет.'));
  } else {
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();
    items.forEach(a => {
      let row = list.querySelector(`.row[data-id="${a.planning_id}"]`);
      const fp = apptFp(a);
      if (!row) {
        row = renderRow(a);
        list.appendChild(row);
      } else if (row.dataset.fp !== fp) {
        paintRow(row, a);
      }
      const past = isToday && toMinutes(a.time) <= nowMin;
      row.classList.toggle('past', past);
      row.classList.toggle('fresh', (freshUntil.get(a.planning_id) || 0) > Date.now());
    });
    [...list.querySelectorAll('.row')].forEach(row => {
      if (!ids.includes(row.dataset.id)) row.remove();
    });
    const savedNow = list.querySelector('.now');
    if (savedNow) savedNow.remove();
    let after = null;
    ids.forEach(id => {
      const row = list.querySelector(`.row[data-id="${id}"]`);
      if (!row) return;
      if (row.previousElementSibling !== after) list.insertBefore(row, after ? after.nextSibling : list.firstChild);
      after = row;
    });
    if (savedNow) list.appendChild(savedNow);
  }
  placeNow(list, isToday && items.length > 0, nowMin);
  ensureScheduleEnd(list, $('date').value);
  if (auto && !userScrolled.has(String(branch.branch_id))) autoScroll(list, isToday);
  else if (same) {
    programmaticScroll = true;
    list.scrollTop = keepScroll;
    programmaticScroll = false;
  } else restoreAnchor(list, anchor);
}

function renderRow(a) {
  const row = el('article', 'row');
  row.dataset.id = String(a.planning_id);
  row.appendChild(el('div', 'time'));
  const who = el('div', 'who');
  who.appendChild(el('div', 'patient'));
  who.appendChild(el('div', 'doctor'));
  who.appendChild(el('div', 'tagline'));
  row.appendChild(who);
  paintRow(row, a);
  return row;
}

function paintRow(row, a) {
  const state = a.is_waitlist ? 'waitlist' : (a.confirmation || 'pending');
  const past = row.classList.contains('past');
  const fresh = row.classList.contains('fresh');
  row.className = `row ${state}`;
  if (past) row.classList.add('past');
  if (fresh) row.classList.add('fresh');
  row.dataset.time = a.time || '';
  row.dataset.fp = apptFp(a);
  row.querySelector('.time').textContent = a.time || '--:--';
  row.querySelector('.patient').textContent = a.patient_name || 'Без имени';
  const doctor = row.querySelector('.doctor');
  doctor.textContent = a.doctor_name || '';
  doctor.hidden = !a.doctor_name;
  const tags = row.querySelector('.tagline');
  tags.replaceChildren();
  if (a.is_waitlist) {
    tags.appendChild(el('span', 'pill waitlist', 'лист ожидания'));
  } else if (a.confirmation_hint && !a.confirmation) {
    tags.appendChild(el('span', 'pill pending', a.confirmation_hint));
  } else {
    tags.appendChild(el('span', `pill ${state}`, LABEL[state]));
    if (state !== 'pending') tags.appendChild(el('span', 'via', 'ответ из MAX'));
  }
  if (a.on_waitlist && (state === 'declined' || state === 'reschedule')) {
    tags.appendChild(el('span', 'pill waitlist', 'в листе ожидания'));
  }
}

function apptFp(a) {
  return JSON.stringify({
    t: a.time || '', n: a.patient_name || '', d: a.doctor_name || '',
    c: a.confirmation || '', h: a.confirmation_hint || '',
    w: !!a.is_waitlist, o: !!a.on_waitlist
  });
}

function placeNow(list, isToday, nowMin) {
  let nowEl = list.querySelector('.now');
  if (!isToday) {
    if (nowEl) nowEl.remove();
    return;
  }
  if (!nowEl) nowEl = nowLine();
  const label = `СЕЙЧАС ${msk(new Date()).toTimeString().slice(0,5)}`;
  const span = nowEl.querySelector('span');
  if (span.textContent !== label) span.textContent = label;
  let before = null;
  for (const row of list.querySelectorAll('.row')) {
    if (toMinutes(row.dataset.time) > nowMin) { before = row; break; }
  }
  if (before) {
    if (nowEl.nextSibling !== before) list.insertBefore(nowEl, before);
  } else if (list.lastElementChild !== nowEl) {
    list.appendChild(nowEl);
  }
}

function autoScroll(list, isToday) {
  programmaticScroll = true;
  if (!isToday) {
    list.scrollTop = 0;
    programmaticScroll = false;
    return;
  }
  const nowEl = list.querySelector('.now');
  if (!nowEl) {
    list.scrollTop = 0;
    programmaticScroll = false;
    return;
  }
  const listBox = list.getBoundingClientRect();
  const nowBox = nowEl.getBoundingClientRect();
  const target = list.scrollTop + (nowBox.top - listBox.top) - list.clientHeight * 0.25;
  const max = Math.max(0, list.scrollHeight - list.clientHeight);
  list.scrollTop = Math.max(0, Math.min(target, max));
  programmaticScroll = false;
}

function captureAnchor(list) {
  const edge = list.getBoundingClientRect().top;
  for (const row of list.querySelectorAll('.row')) {
    const box = row.getBoundingClientRect();
    if (box.bottom > edge + 1) return {id: row.dataset.id, delta: box.top - edge};
  }
  return null;
}

function restoreAnchor(list, anchor) {
  if (!anchor) return;
  const row = list.querySelector(`.row[data-id="${anchor.id}"]`);
  if (!row) return;
  const delta = row.getBoundingClientRect().top - list.getBoundingClientRect().top;
  if (Math.abs(delta - anchor.delta) < 1) return;
  programmaticScroll = true;
  list.scrollTop += delta - anchor.delta;
  programmaticScroll = false;
}

function ensureScheduleEnd(list, iso) {
  let end = list.querySelector('.schedule-end');
  if (!end) {
    end = el('div', 'schedule-end');
    list.appendChild(end);
  }
  const parts = String(iso || '').split('-');
  const label = parts.length >= 3 ? parts[2] + '.' + parts[1] : String(iso || '');
  end.textContent = 'Конец расписания на ' + label;
  list.appendChild(end);
}

function nowLine() {
  const wrap = el('div', 'now');
  wrap.appendChild(el('span', '', `СЕЙЧАС ${msk(new Date()).toTimeString().slice(0,5)}`));
  return wrap;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function stat(kind, value, label) {
  const s = el('span', `stat ${kind}`);
  s.appendChild(el('b', '', value));
  s.appendChild(document.createTextNode(' ' + label));
  return s;
}
const toMinutes = t => {
  const [h, m] = String(t || '0:0').split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
};
function minutesNow() {
  const d = msk(new Date());
  return d.getHours() * 60 + d.getMinutes();
}
function selectingText() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return false;
  const node = sel.anchorNode;
  const host = node && (node.nodeType === 1 ? node : node.parentElement);
  return !!(host && (board.contains(host) || $('waitlistPanel').contains(host)));
}

function renderStaleness() {
  if (!lastOkAt) return;
  const age = Date.now() - lastOkAt;
  if (age < CONFIG.STALE_MS) {
    dot.className = 'dot';
    liveText.textContent = 'обновляется';
  } else if (age < CONFIG.STALE_MS * 3) {
    dot.className = 'dot stale';
    liveText.textContent = `данные от ${new Date(lastOkAt).toTimeString().slice(0,8)}`;
  } else {
    dot.className = 'dot down';
    liveText.textContent = 'нет связи с сервером';
  }
}
function showBanner(msg){ banner.textContent = msg; banner.classList.add('show'); }
function hideBanner(){ banner.classList.remove('show'); }

function setTab(name) {
  if (activeTab === name) return;
  activeTab = name;
  viewEpoch++;
  $('tabSchedule').classList.toggle('active', name === 'schedule');
  $('tabWaitlist').classList.toggle('active', name === 'waitlist');
  $('tabStaff').classList.toggle('active', name === 'staff');
  $('board').hidden = name !== 'schedule';
  $('noteSchedule').hidden = name !== 'schedule';
  $('waitlistPanel').hidden = name !== 'waitlist';
  $('noteWaitlist').hidden = name !== 'waitlist';
  $('staffPanel').hidden = name !== 'staff';
  if (name === 'schedule') {
    document.querySelectorAll('#board .list').forEach(list => {
      const branch = list.closest('.col') && list.closest('.col').dataset.branch;
      if (branch && !userScrolled.has(branch)) autoScroll(list, $('date').value === todayISO());
    });
  }
  if (name === 'waitlist') waitlistKey = '';
  if (name === 'staff') { loadStaff(); return; }
  load();
}

async function refreshWaitlistCount() {
  if (waitlistBusy) return;
  waitlistBusy = true;
  try {
    const res = await fetch(`${CONFIG.API_BASE}${CONFIG.WAITLIST}?status=open&page=1&per_page=1`, {credentials:'same-origin'});
    if (!res.ok) return;
    const body = await res.json();
    if (body.success && body.data) $('waitlistCount').textContent = String(body.data.open_total || 0);
  } catch (e) {
  } finally {
    waitlistBusy = false;
    if (waitlistQueued) {
      waitlistQueued = false;
      if (activeTab === 'waitlist') loadWaitlist();
    }
  }
}

function waitlistURL() {
  const scope = $('wlStatus').value || 'open';
  const work = $('wlWork') ? $('wlWork').value : 'all';
  const source = $('wlSource') ? $('wlSource').value : 'all';
  const branch = $('branch') ? $('branch').value : '';
  const status = work && work !== 'all' ? work : scope;
  const params = new URLSearchParams({status, page: String(wlPage), per_page: '50', source});
  if (branch) params.set('branch', branch);
  return {key: `${status}|${branch}|${wlPage}|${source}`, url: `${CONFIG.API_BASE}${CONFIG.WAITLIST}?${params}`};
}

async function loadWaitlist() {
  if (waitlistBusy) { waitlistQueued = true; return; }
  waitlistBusy = true;
  const epoch = viewEpoch;
  const q = waitlistURL();
  try {
    const res = await fetch(q.url, {credentials:'same-origin'});
    if (epoch !== viewEpoch || q.key !== waitlistURL().key) return;
    if (await authStop(res)) return;
    if (!res.ok) throw new Error(`сервер ответил ${res.status}`);
    const body = await res.json();
    if (!body.success) throw new Error(body.error || 'сервер вернул ошибку');
    if (epoch !== viewEpoch || selectingText()) return;
    lastOkAt = Date.now();
    hideBanner();
    paintWaitlist(body.data, q.key);
  } catch (err) {
    if (epoch === viewEpoch) showBanner(`Не удалось обновить лист ожидания: ${err.message}.`);
  } finally {
    waitlistBusy = false;
    if (waitlistQueued || epoch !== viewEpoch) {
      waitlistQueued = false;
      if (activeTab === 'waitlist') loadWaitlist();
      else arm();
    } else arm();
  }
}

function paintWaitlist(data, key) {
  const items = data.items || [];
  $('waitlistCount').textContent = String(data.open_total || 0);
  const pages = Math.max(1, Math.ceil((data.total || 0) / (data.per_page || 50)));
  $('wlPageLabel').textContent = `${data.page || 1} / ${pages}`;
  $('wlPager').hidden = pages <= 1;
  const wrap = $('waitlistList');
  const rebuild = key !== waitlistKey;
  if (rebuild) {
    waitlistKey = key;
    pendingWl.clear();
    wrap.innerHTML = '';
  }
  if (!items.length) {
    if (rebuild || !wrap.querySelector('.empty')) {
      if (rebuild) wrap.innerHTML = '';
      wrap.querySelectorAll('table,.empty').forEach(n => n.remove());
      wrap.appendChild(el('div', 'empty', 'Открытых строк нет.'));
    }
    wlSeen = new Map();
    return;
  }
  wrap.querySelectorAll('.empty').forEach(n => n.remove());
  let table = wrap.querySelector('table');
  if (!table) {
    table = document.createElement('table');
    table.className = 'waitlist-table';
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['Источник','Ответ','Пациент','Исходная запись','В Медиалоге','Новая будущая запись','Работа'].forEach(title => {
      hr.appendChild(el('th', '', title));
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    table.appendChild(document.createElement('tbody'));
    wrap.appendChild(table);
  }
  const tbody = table.querySelector('tbody');
  const ids = items.map(it => (it.source || 'max') + ':' + it.id);
  items.forEach(it => {
    let tr = tbody.querySelector(`tr[data-key="${(it.source || 'max') + ':' + it.id}"]`);
    if (!tr) {
      tr = renderWaitlistRow(it);
      tbody.appendChild(tr);
      if (wlSeen.size) wlFresh.set(it.id, Date.now() + CONFIG.FRESH_MS);
      wlSeen.set(it.id, it.status);
    } else if (rowBusy(tr)) {
      if ((it.status || '') !== tr.dataset.status) showConflict(tr);
      pendingWl.set(tr.dataset.key, it);
    } else {
      applyWaitlistItem(tr, it);
    }
    tr.classList.toggle('fresh', (wlFresh.get(it.id) || 0) > Date.now());
  });
  [...tbody.querySelectorAll('tr')].forEach(tr => {
    if (!ids.includes(tr.dataset.key)) {
      pendingWl.delete(tr.dataset.key);
      tr.remove();
    }
  });
  let after = null;
  ids.forEach(id => {
    const tr = tbody.querySelector(`tr[data-key="${id}"]`);
    if (!tr) return;
    if (tr.previousElementSibling !== after) tbody.insertBefore(tr, after ? after.nextSibling : tbody.firstChild);
    after = tr;
  });
}

function renderWaitlistRow(it) {
  const tr = document.createElement('tr');
  tr.dataset.id = String(it.id);
  tr.dataset.source = it.source || 'max';
  tr.dataset.key = tr.dataset.source + ':' + tr.dataset.id;
  tr.appendChild(el('td'));
  tr.appendChild(el('td'));
  tr.appendChild(el('td'));
  tr.appendChild(el('td'));
  tr.appendChild(el('td'));
  tr.appendChild(el('td'));
  const work = el('td');
  const oc = document.createElement('select');
  oc.className = 'wl-outcome';
  oc.setAttribute('aria-label', 'Результат звонка');
  const blank = document.createElement('option');
  blank.value = '';
  blank.textContent = 'Результат звонка';
  oc.appendChild(blank);
  OUTCOMES.forEach(([v,l]) => {
    const o = document.createElement('option');
    o.value = v; o.textContent = l;
    oc.appendChild(o);
  });
  const backBtn = document.createElement('button');
  backBtn.type = 'button';
  backBtn.className = 'btn light wl-reopen';
  backBtn.textContent = 'Вернуть в работу';
  backBtn.addEventListener('click', () => reopenRow(tr));
  work.appendChild(oc);
  work.appendChild(el('div', 'wl-outcome-text'));
  work.appendChild(backBtn);
  work.appendChild(el('div', 'wl-meta'));
  work.appendChild(el('div', 'wl-saved'));
  tr.appendChild(work);
  tr.addEventListener('focusin', () => touchRow(tr));
  tr.addEventListener('change', () => { touchRow(tr); onOutcome(tr); });
  tr.addEventListener('pointerdown', () => touchRow(tr));
  tr.addEventListener('keydown', () => touchRow(tr));
  tr.addEventListener('focusout', () => scheduleRelease(tr));
  applyWaitlistItem(tr, it);
  return tr;
}

function applyWaitlistItem(tr, it) {
  const cells = tr.children;
  tr.dataset.source = it.source || tr.dataset.source || 'max';
  tr.dataset.key = tr.dataset.source + ':' + tr.dataset.id;
  cells[0].textContent = tr.dataset.source === 'registry' ? 'Регистратура' : 'MAX';
  const answer = cells[1];
  answer.replaceChildren();
  answer.appendChild(el('div', '', it.created_at_msk || it.created_at || ''));
  answer.appendChild(el('div', '', REASON_LABEL[it.reason] || it.reason || ''));
  if (it.creator_name) answer.appendChild(el('div', '', 'поставил: ' + it.creator_name));

  const patient = cells[2];
  patient.replaceChildren();
  patient.appendChild(el('div', '', it.patient_name || ''));
  if (it.patient_phone) {
    const a = document.createElement('a');
    a.href = 'tel:' + String(it.patient_phone);
    a.textContent = it.patient_phone;
    patient.appendChild(a);
  }
  patient.appendChild(el('div', '', it.patient_birth || '—'));

  const orig = cells[3];
  orig.replaceChildren();
  orig.appendChild(el('div', '', it.orig_date_start || ''));
  orig.appendChild(el('div', '', BRANCH_NAME[it.branch_id] || String(it.branch_id || '')));
  orig.appendChild(el('div', '', it.orig_doctor || ''));
  orig.appendChild(el('div', '', it.orig_service || ''));

  const med = cells[4];
  med.replaceChildren();
  const active = it.medialog_state === 'запись действует';
  const noFuture = !it.future_date_start;
  if (active && (noFuture || it.outcome === 'refused')) med.appendChild(el('div', 'med-alert', 'действует — отменить в клиенте'));
  else med.textContent = it.medialog_state || '';
  tr.dataset.medialog = it.medialog_state || '';
  tr.dataset.future = it.future_date_start || '';

  const fut = cells[5];
  fut.replaceChildren();
  fut.appendChild(el('div', '', it.future_label || '—'));
  if (it.future_date_start) fut.appendChild(el('div', '', it.future_date_start));
  if (it.future_doctor) fut.appendChild(el('div', '', it.future_doctor));
  if (it.future_service) fut.appendChild(el('div', '', it.future_service));

  const work = cells[6];
  const oc = work.querySelector('.wl-outcome');
  const closed = it.status === 'closed' || it.status === 'rebooked';
  if (it.outcome && [...oc.options].some(o => o.value === it.outcome)) oc.value = it.outcome;
  else oc.value = '';
  tr.dataset.status = it.status || '';
  tr.dataset.outcome = it.outcome || '';
  tr.dataset.version = String(it.version || 1);
  oc.hidden = closed;
  const text = work.querySelector('.wl-outcome-text');
  if (text) {
    text.hidden = !closed;
    text.textContent = outcomeLabel(it.outcome);
  }
  const backBtn = work.querySelector('.wl-reopen');
  if (backBtn) backBtn.hidden = !closed;
  const meta = work.querySelector('.wl-meta');
  if (meta) meta.textContent = it.updated_by ? `${it.updated_by} · ${it.updated_at || ''}` : '';
  const note = work.querySelector('.wl-conflict');
  if (note) note.remove();
  pendingWl.delete(tr.dataset.key);
  if (wlSeen.size && wlSeen.get(it.id) !== it.status) wlFresh.set(it.id, Date.now() + CONFIG.FRESH_MS);
  wlSeen.set(it.id, it.status);
}

function showConflict(tr) {
  const work = tr.children[6];
  if (work.querySelector('.wl-conflict')) return;
  const box = el('div', 'wl-conflict');
  box.appendChild(el('div', '', 'Изменено другим сотрудником'));
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn';
  btn.textContent = 'Обновить строку';
  btn.addEventListener('click', () => {
    const item = pendingWl.get(tr.dataset.key);
    if (item) applyWaitlistItem(tr, item);
  });
  box.appendChild(btn);
  work.appendChild(box);
}

function touchRow(tr) {
  tr._busyUntil = Date.now() + BUSY_MS;
  clearTimeout(tr._release);
}
function rowBusy(tr) {
  if (tr.contains(document.activeElement)) return true;
  return Date.now() < (tr._busyUntil || 0);
}
function scheduleRelease(tr) {
  setTimeout(() => {
    if (tr.contains(document.activeElement)) return;
    const wait = Math.max(0, (tr._busyUntil || 0) - Date.now());
    clearTimeout(tr._release);
    tr._release = setTimeout(() => releaseRow(tr), wait);
  }, 0);
}
function releaseRow(tr) {
  if (rowBusy(tr)) return;
  const item = pendingWl.get(tr.dataset.key);
  if (item) applyWaitlistItem(tr, item);
}

function markRow(tr, text) {
  const n = tr.querySelector('.wl-saved');
  if (n) n.textContent = text;
}

function outcomeLabel(value) {
  const found = OUTCOMES.find(([v]) => v === value);
  return found ? found[1] : (value || '');
}

async function onOutcome(tr) {
  const oc = tr.querySelector('.wl-outcome');
  const outcome = oc.value;
  const prev = tr.dataset.outcome || '';
  if (!outcome || outcome === prev) return;
  if (CLOSING.has(outcome) && tr.dataset.medialog === 'запись действует') {
    const ok = await askClose(outcome);
    if (!ok) {
      oc.value = prev;
      return;
    }
  }
  saveWaitlist(tr, outcome, '');
}

function reopenRow(tr) {
  saveWaitlist(tr, '', 'reopen');
}

function askClose(outcome) {
  const modal = $('confirmModal');
  $('confirmText').textContent = outcome === 'rebooked'
    ? 'Новая запись создана в клиенте? Старую отмените там же'
    : 'Запись в Медиалоге ещё действует — отмените её в клиенте (правый щелчок → „Пациент не придёт“). Закрыть строку?';
  modal.hidden = false;
  return new Promise(resolve => {
    const yes = $('confirmYes');
    const no = $('confirmNo');
    const done = value => {
      modal.hidden = true;
      yes.removeEventListener('click', onYes);
      no.removeEventListener('click', onNo);
      resolve(value);
    };
    const onYes = () => done(true);
    const onNo = () => done(false);
    yes.addEventListener('click', onYes);
    no.addEventListener('click', onNo);
  });
}

async function authStop(res) {
  if (res.status === 401) {
    window.location.href = '/dashboard/login';
    return true;
  }
  if (res.status !== 403) return false;
  let code = '';
  try {
    const body = await res.clone().json();
    if (body.error_details) code = body.error_details.code || '';
  } catch (e) {}
  if (code === 'PASSWORD_CHANGE_REQUIRED') {
    window.location.href = '/dashboard/password';
    return true;
  }
  return false;
}

async function saveWaitlist(tr, outcome, action) {
  const epoch = viewEpoch;
  const filterKey = waitlistKey;
  const oc = tr.querySelector('.wl-outcome');
  const prev = tr.dataset.outcome || '';
  markRow(tr, 'Сохраняется…');
  const version = Number(tr.dataset.version || '1');
  const payload = action === 'reopen' ? {action: 'reopen', version} : {outcome, version};
  try {
    const res = await fetch(`${CONFIG.API_BASE}${CONFIG.WAITLIST}/${tr.dataset.source}/${tr.dataset.id}`, {
      method: 'PATCH',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'X-Dashboard-Request': '1'
      },
      body: JSON.stringify(payload)
    });
    if (epoch !== viewEpoch || filterKey !== waitlistKey) return;
    if (await authStop(res)) return;
    if (res.status === 409) {
      let msg = 'Строку уже изменил другой сотрудник';
      let fresh = null;
      try {
        const body = await res.json();
        if (body.error_details && body.error_details.message) msg = body.error_details.message;
        else if (body.error) msg = body.error;
        fresh = body.data || null;
      } catch (e) {}
      if (fresh) applyWaitlistItem(tr, fresh);
      else if (oc) oc.value = prev;
      showBanner(msg);
      return;
    }
    if (!res.ok) {
      let msg = `сервер ответил ${res.status}`;
      try {
        const body = await res.json();
        if (body.error) msg = body.error;
      } catch (e) {}
      if (oc) oc.value = prev;
      showBanner(msg);
      markRow(tr, msg);
      return;
    }
    const body = await res.json();
    if (epoch !== viewEpoch || filterKey !== waitlistKey) return;
    if (body.data && body.data.id) applyWaitlistItem(tr, body.data);
    pendingWl.delete(tr.dataset.key);
    const clock = msk(new Date()).toTimeString().slice(0, 5);
    markRow(tr, 'Сохранено ✓ ' + (dashUser || '') + ', ' + clock);
  } catch (err) {
    if (epoch !== viewEpoch || filterKey !== waitlistKey) return;
    if (oc) oc.value = prev;
    showBanner(`Не удалось сохранить: ${err.message}`);
    markRow(tr, err.message);
  }
}

async function reloadWaitlistRow(id, source) {
  const epoch = viewEpoch;
  const filterKey = waitlistKey;
  const q = waitlistURL();
  const res = await fetch(q.url, {credentials:'same-origin'});
  if (epoch !== viewEpoch || filterKey !== waitlistKey) return;
  if (!res.ok) return;
  const body = await res.json();
  if (epoch !== viewEpoch || filterKey !== waitlistKey) return;
  if (!body.success || !body.data) return;
  const data = body.data;
  $('waitlistCount').textContent = String(data.open_total || 0);
  const item = (data.items || []).find(it => String(it.id) === String(id) && (!source || (it.source || 'max') === source));
  const key = (source || (item && item.source) || 'max') + ':' + id;
  const tr = document.querySelector(`#waitlistList tr[data-key="${key}"]`) || document.querySelector(`#waitlistList tr[data-id="${id}"]`);
  if (item && tr) {
    applyWaitlistItem(tr, item);
    return;
  }
  if (tr) tr.remove();
  const wrap = $('waitlistList');
  if (!wrap.querySelector('tbody tr')) {
    wrap.querySelectorAll('table,.empty').forEach(n => n.remove());
    wrap.appendChild(el('div', 'empty', 'Открытых строк нет.'));
  }
}

function arm() {
  clearTimeout(timer);
  if (document.hidden) return;
  timer = setTimeout(() => { load(); }, CONFIG.POLL_MS);
}

function pinToday() {
  followedDay = todayISO();
  $('date').value = followedDay;
  userScrolled.clear();
  scheduleKey = '';
  viewEpoch++;
}

$('date').addEventListener('change', () => {
  viewEpoch++;
  userScrolled.clear();
  if ($('date').value === todayISO()) followedDay = todayISO();
  scheduleKey = '';
  load();
});
$('today').addEventListener('click', () => {
  $('date').value = todayISO();
  followedDay = todayISO();
  viewEpoch++;
  userScrolled.clear();
  scheduleKey = '';
  load();
});
window.addEventListener('pageshow', event => {
  pinToday();
  if (event.persisted || document.readyState === 'complete') load();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
function storageGet(key) {
  try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}
function restoreChoice(id, key) {
  const saved = storageGet(key);
  const el = $(id);
  if (!el || !saved) return;
  if ([...el.options].some(o => o.value === saved)) el.value = saved;
}

async function loadMe() {
  restoreChoice('wlStatus', 'mk_dash_wl_scope');
  restoreChoice('wlWork', 'mk_dash_wl_status');
  restoreChoice('wlSource', 'mk_dash_wl_source');
  try {
    const res = await fetch(`${CONFIG.API_BASE}/dashboard/me`, {credentials: 'same-origin'});
    if (res.status === 401) {
      window.location.href = '/dashboard/login';
      return;
    }
    if (!res.ok) return;
    const body = await res.json();
    if (!body.success || !body.data) return;
    const me = body.data;
    dashUser = me.full_name || me.login || '';
    const sel = $('branch');
    const one = (me.branches || []).length <= 1;
    [...sel.options].slice(1).forEach(o => o.remove());
    (me.branches || []).forEach(b => {
      const o = document.createElement('option');
      o.value = String(b.id);
      o.textContent = b.name;
      sel.appendChild(o);
    });
    const saved = storageGet('mk_dash_branch');
    if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
    if (one && me.branches && me.branches[0]) sel.value = String(me.branches[0].id);
    let label = $('branchLabel');
    if (!label) {
      label = document.createElement('span');
      label.id = 'branchLabel';
      label.className = 'branch-label';
      sel.after(label);
    }
    sel.hidden = one;
    label.hidden = !one;
    label.textContent = one && me.branches[0] ? me.branches[0].name : '';
    if (me.role === 'admin') $('tabStaff').hidden = false;
  } catch (e) {}
}

async function loadStaff() {
  const box = $('staffTable');
  box.replaceChildren();
  try {
    const res = await fetch(`${CONFIG.API_BASE}/dashboard/staff`, {credentials: 'same-origin'});
    if (await authStop(res)) return;
    if (!res.ok) throw new Error(`сервер ответил ${res.status}`);
    const body = await res.json();
    if (!body.success) throw new Error(body.error || 'сервер вернул ошибку');
    const users = (body.data && body.data.users) || [];
    const table = document.createElement('table');
    const hr = document.createElement('tr');
    ['Логин', 'Имя', 'Роль', 'Филиалы', 'Активен', ''].forEach(title => hr.appendChild(el('th', '', title)));
    const thead = document.createElement('thead');
    thead.appendChild(hr);
    table.appendChild(thead);
    const tb = document.createElement('tbody');
    users.forEach(u => {
      const tr = document.createElement('tr');
      tr.appendChild(el('td', '', u.login || ''));
      tr.appendChild(el('td', '', u.full_name || ''));
      const role = document.createElement('select');
      [['registrar','Регистратор'],['manager','Директор / колл-центр'],['admin','ИТ']].forEach(([v,l]) => {
        const o = document.createElement('option');
        o.value = v; o.textContent = l;
        role.appendChild(o);
      });
      role.value = u.role;
      const branches = document.createElement('input');
      branches.value = u.branches || '';
      const active = document.createElement('input');
      active.type = 'checkbox';
      active.checked = !!u.active;
      const save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn';
      save.textContent = 'Сохранить';
      save.addEventListener('click', () => updateStaff(u.id, {role: role.value, branches: branches.value, active: active.checked}));
      const reset = document.createElement('button');
      reset.type = 'button';
      reset.className = 'btn';
      reset.textContent = 'Сбросить пароль';
      reset.addEventListener('click', () => updateStaff(u.id, {role: role.value, branches: branches.value, active: active.checked, reset_password: true}));
      tr.appendChild(el('td')).appendChild(role);
      tr.appendChild(el('td')).appendChild(branches);
      tr.appendChild(el('td')).appendChild(active);
      const actions = el('td');
      actions.appendChild(save);
      actions.appendChild(reset);
      tr.appendChild(actions);
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    box.appendChild(table);
  } catch (err) {
    box.appendChild(el('div', 'empty', err.message));
  }
}

async function updateStaff(id, payload) {
  try {
    const res = await fetch(`${CONFIG.API_BASE}/dashboard/staff/${id}`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json', 'X-Dashboard-Request': '1'},
      body: JSON.stringify(payload)
    });
    if (await authStop(res)) return;
    const body = await res.json();
    if (!res.ok || !body.success) throw new Error(body.error || `сервер ответил ${res.status}`);
    if (body.data && body.data.temporary_password) $('staffTemp').textContent = 'Временный пароль: ' + body.data.temporary_password;
    else $('staffTemp').textContent = 'Сохранено';
    loadStaff();
  } catch (err) {
    $('staffTemp').textContent = err.message;
  }
}

$('tabSchedule').addEventListener('click', () => setTab('schedule'));
$('tabWaitlist').addEventListener('click', () => setTab('waitlist'));
$('tabStaff').addEventListener('click', () => setTab('staff'));
$('branch').addEventListener('change', () => {
  storageSet('mk_dash_branch', $('branch').value);
  viewEpoch++;
  userScrolled.clear();
  scheduleKey = '';
  waitlistKey = '';
  wlPage = 1;
  load();
});
$('wlStatus').addEventListener('change', () => {
  storageSet('mk_dash_wl_scope', $('wlStatus').value);
  wlPage = 1; viewEpoch++; waitlistKey = ''; loadWaitlist();
});
$('wlWork').addEventListener('change', () => {
  storageSet('mk_dash_wl_status', $('wlWork').value);
  wlPage = 1; viewEpoch++; waitlistKey = ''; loadWaitlist();
});
$('wlSource').addEventListener('change', () => {
  storageSet('mk_dash_wl_source', $('wlSource').value);
  wlPage = 1; viewEpoch++; waitlistKey = ''; loadWaitlist();
});
$('wlPrev').addEventListener('click', () => { if (wlPage > 1) { wlPage--; viewEpoch++; waitlistKey = ''; loadWaitlist(); } });
$('wlNext').addEventListener('click', () => { wlPage++; viewEpoch++; waitlistKey = ''; loadWaitlist(); });
$('staffForm').addEventListener('submit', async event => {
  event.preventDefault();
  try {
    const res = await fetch(`${CONFIG.API_BASE}/dashboard/staff`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json', 'X-Dashboard-Request': '1'},
      body: JSON.stringify({
        login: $('staffLogin').value,
        full_name: $('staffName').value,
        role: $('staffRole').value,
        branches: $('staffBranches').value
      })
    });
    if (await authStop(res)) return;
    const body = await res.json();
    if (!res.ok || !body.success) throw new Error(body.error || `сервер ответил ${res.status}`);
    $('staffTemp').textContent = body.data && body.data.temporary_password ? 'Временный пароль: ' + body.data.temporary_password : 'Сохранено';
    $('staffForm').reset();
    $('staffBranches').value = '106';
    loadStaff();
  } catch (err) {
    $('staffTemp').textContent = err.message;
  }
});

loadMe().finally(() => { load(); arm(); });
</script>
</body>
</html>
